backup:
  encryptionPasswordTemplate: "{{ .backupEncryptionSecret }}"
createNamespace: false
namespace: ""
replicas: 3
allowFromNamespaces: []

mongodb:
  mongodb:
    registryOverride:
    image: library/mongo
    tag:
  exporter:
    registryOverride:
    image: percona/mongodb_exporter
    # renovate: datasource=docker depName=percona/mongodb_exporter
    tag: 0.54.0@sha256:934e9db87e85e0fa63654e73c3504845993a254e898783ca905e65a68848b5a4
env:
  MONGODB_LIMITS_CPU: 1
  MONGODB_LIMITS_MEMORY: 1Gi
  MONGODB_EXTRA_PASSWORDS: ""
  # there is no default for MONGODB_PVC_SIZE_GI
  # resizing is difficult and you anyway need to consider the capacity.
  # MONGODB_PVC_SIZE_GI: 5
  # e.g. accounting-app/login-service
  OPENBAO_SECRETS_PATH_PREFIX:
  # defaults to {{ .Release.Name }}, do not use leading or trailing slashes
  # OPENBAO_SECRETS_ENVIRONMENT_SLUG
  OPENBAO_SECRETS_PATH_SUFFIX: mongo

  # e.g. accounting-app/login-service
  # INTERNAL_OPENBAO_SECRETS_PATH_PREFIX:
  # defaults to {{ .Release.Name }}, do not use leading or trailing slashes
  # INTERNAL_OPENBAO_SECRETS_ENVIRONMENT_SLUG
  # INTERNAL_OPENBAO_SECRETS_PATH_SUFFIX: mongo
pvc:
  encrypted: true
  storageClassName: ssd-encrypted
registry: dockerhub.vshn.net
