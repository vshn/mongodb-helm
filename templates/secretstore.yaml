apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mongodb-store
  namespace: {{ include "mongodb.namespace" . }}
spec:
  provider:
    vault:
      server: "http://{{ .Values.env.OPENBAO_SVC_NAME }}.{{ .Values.env.OPENBAO_NAMESPACE }}.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "mongodb-{{ .Release.Name }}-reader"
          serviceAccountRef:
            name: "{{ .Release.Name }}-mongodb"
            namespace: {{ include "mongodb.namespace" . }}
