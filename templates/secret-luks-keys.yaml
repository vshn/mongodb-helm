{{ if eq .Values.secretManagement "plain" }}
{{- range $i, $e := until (.Values.replicas | int) }}
---
kind: Secret
apiVersion: v1
metadata:
  name: mongodb-data-mongodb-{{ $i }}-luks-key
  namespace: {{ include "mongodb.namespace" $ }}
  labels:
    k8ify.service: mongodb
stringData:
  luksKey: "{{ $.Values.env.MONGODB_DATA_MONGODB_LUKS_KEY | default $.Values.env.MONGODB_DATA_MONGODB_0_LUKS_KEY }}"
{{- end }}
{{- end }}
