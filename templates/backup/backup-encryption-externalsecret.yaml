apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-encryption
  namespace: {{ include "mongodb.namespace" . }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: mongodb-store
    kind: SecretStore
  target:
    name: backup-encryption
    template:
      data:
        password: "{{ .Values.backup.encryptionPasswordTemplate }}"
  dataFrom:
    - extract:
        key: app/{{ .Release.Name }}/mongo
