apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-url
  namespace: {{ include "mongodb.namespace" . }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: mongodb-store
    kind: SecretStore
  target:
    name: mongodb-url
    template:
      data:
        MONGODB_URL: {{ .Values.backup.mongodbUrlTemplate }}
  dataFrom:
    - extract:
        key: app/dev/mongo
