{{ if eq .Values.secretManagement "plain" }}
kind: Secret
apiVersion: v1
metadata:
  name: mongodb-env
  namespace: {{ include "mongodb.namespace" . }}
  labels:
    k8ify.service: mongodb
data:
  MONGO_INITDB_ROOT_USERNAME: {{ "root" | b64enc }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.env.MONGODB_ROOT_PASSWORD | b64enc }}
  MONGODB_ROOT_USER: {{ "root" | b64enc }}
  MONGODB_ROOT_PASSWORD: {{ .Values.env.MONGODB_ROOT_PASSWORD | b64enc }}
  MONGODB_REPLICA_SET_NAME: {{ .Values.env.MONGODB_REPLICA_SET_NAME | default .Release.Name | b64enc }}
  MONGODB_REPLICA_SET_KEY: {{ .Values.env.MONGODB_REPLICA_SET_KEY | b64enc }}
{{- end }}
