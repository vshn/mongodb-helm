{{- $root := . }}
{{- range $i, $e := until 3 }}
---
kind: Service
apiVersion: v1
metadata:
  name: mongodb-{{ $i }}
  namespace: {{ include "mongodb.namespace" $root }}
  labels:
    k8ify.service: mongodb
spec:
  clusterIP: None
  ports:
    - name: '27017'
      protocol: TCP
      port: 27017
      targetPort: 27017
  selector:
    k8ify.service: mongodb
    statefulset.kubernetes.io/pod-name: mongodb-{{ $i }}
{{- end }}
