{{- if eq .Values.secretManagement "externalsecrets" }}
{{- $env := .Values.env }}

{{- $secretsPathPrefix := "" }}
{{- if hasKey $env "INTERNAL_OPENBAO_SECRETS_PATH_PREFIX" }}
  {{- $secretsPathPrefix = $env.INTERNAL_OPENBAO_SECRETS_PATH_PREFIX }}
{{- else }}
  {{- $secretsPathPrefix = $env.OPENBAO_SECRETS_PATH_PREFIX }}
{{- end }}

{{- $secretsPathEnvSlug := printf "%s" .Release.Name }}
{{- if hasKey $env "INTERNAL_OPENBAO_SECRETS_ENVIRONMENT_SLUG" }}
  {{- $secretsPathEnvSlug = printf "%s" $env.INTERNAL_OPENBAO_SECRETS_ENVIRONMENT_SLUG }}
{{- else if hasKey $env "OPENBAO_SECRETS_ENVIRONMENT_SLUG" }}
  {{- $secretsPathEnvSlug = printf "%s" $env.OPENBAO_SECRETS_ENVIRONMENT_SLUG }}
{{- end }}
{{- if $secretsPathEnvSlug }}
  {{- $secretsPathEnvSlug = printf "/%s" $secretsPathEnvSlug }}
{{- end }}

{{- $secretsPathSuffix := "" }}
{{- if hasKey $env "INTERNAL_OPENBAO_SECRETS_PATH_SUFFIX" }}
  {{- $secretsPathSuffix = $env.INTERNAL_OPENBAO_SECRETS_PATH_SUFFIX }}
{{- else }}
  {{- $secretsPathSuffix = $env.OPENBAO_SECRETS_PATH_SUFFIX }}
{{- end }}
{{- if $secretsPathSuffix }}
  {{- $secretsPathSuffix = printf "/%s" $secretsPathSuffix }}
{{- end }}

{{- $internalSecretPath := printf "%s%s%s" $secretsPathPrefix $secretsPathEnvSlug $secretsPathSuffix -}}

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-env
  namespace: {{ include "mongodb.namespace" . }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: mongodb-store
    kind: SecretStore
  target:
    name: mongodb-env
    template:
      metadata:
        labels:
          k8ify.service: mongodb
      data:
        MONGO_INITDB_ROOT_USERNAME: "root"
        MONGO_INITDB_ROOT_PASSWORD: {{ printf "{{ .rootPassword }}" | quote }}
        MONGODB_ROOT_USER: "root"
        MONGODB_ROOT_PASSWORD: {{ printf "{{ .rootPassword }}" | quote }}
        MONGODB_REPLICA_SET_NAME: {{ .Values.env.MONGODB_REPLICA_SET_NAME | default .Release.Name | quote }}
        MONGODB_REPLICA_SET_KEY: {{ printf "{{ .replicaSetKey }}" | quote }}
  dataFrom:
    - extract:
        key: {{ $internalSecretPath }}

{{- range $i, $e := until (.Values.replicas | int) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-data-mongodb-{{ $i }}-luks-key
  namespace: {{ include "mongodb.namespace" $ }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: mongodb-store
    kind: SecretStore
  target:
    name: mongodb-data-mongodb-{{ $i }}-luks-key
    template:
      metadata:
        labels:
          k8ify.service: mongodb
      data:
        luksKey: {{ printf "{{ .luksKey }}" | quote }}
  dataFrom:
    - extract:
        key: {{ $internalSecretPath }}
{{- end }}

{{- end }}
