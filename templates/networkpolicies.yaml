{{- if .Values.allowFromNamespaces }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-from-namespaces
  namespace: {{ include "mongodb.namespace" . }}
spec:
  podSelector:
    matchLabels:
      k8ify.service: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- .Values.allowFromNamespaces | toYaml | nindent 18 }}
      ports:
        - protocol: TCP
          port: 27017
{{- end }}
